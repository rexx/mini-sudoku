<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Source of every raster icon in public/; run `npm run icons:generate` after
       editing.

       These notes sit inside the root element on purpose: libvips sniffs for
       `<svg` within roughly the first kilobyte, and a preamble long enough to
       push the tag past that makes sharp reject the file as an unsupported
       format.

       This exact geometry was checked on an iPhone home screen: iOS composites
       it, generating a dark backdrop and edge lighting. Four earlier marks were
       not - a near-white grid, a saturated grid, an enlarged grid and a solid
       block all came back pressed flat onto a white tile.

       Nothing measurable separates the two groups. Ink coverage, cavity count,
       cavity area, cavity perimeter and connected-component count all overlap
       across ten device observations, and four candidate rules built on them
       were each falsified within a day. So treat the geometry below as a
       verified sample rather than as an instance of a rule, and re-check on a
       device after changing it. See
       cozy-pocket/Cozy-Pocket/docs/app-icon-ios-liquid-glass.md for the
       current state of that investigation.

       The cells reach r=220 at their far corners, past the r=204.8 circle a
       maskable icon may be cropped to. The generator shrinks the maskable
       output on its own, so that circle is not a constraint here. -->
  <g fill="#10B981">
    <rect x="96"  y="96"  width="65" height="65" rx="14" />
    <rect x="266" y="96"  width="65" height="65" rx="14" />
    <rect x="351" y="96"  width="65" height="65" rx="14" />

    <rect x="96"  y="181" width="65" height="65" rx="14" />
    <rect x="181" y="181" width="65" height="65" rx="14" />
    <rect x="266" y="181" width="65" height="65" rx="14" />
    <rect x="351" y="181" width="65" height="65" rx="14" />

    <rect x="96"  y="266" width="65" height="65" rx="14" />
    <rect x="181" y="266" width="65" height="65" rx="14" />
    <rect x="266" y="266" width="65" height="65" rx="14" />
    <rect x="351" y="266" width="65" height="65" rx="14" />

    <rect x="96"  y="351" width="65" height="65" rx="14" />
    <rect x="181" y="351" width="65" height="65" rx="14" />
    <rect x="266" y="351" width="65" height="65" rx="14" />
    <rect x="351" y="351" width="65" height="65" rx="14" />
  </g>

  <!-- Solved cell: reads as a puzzle in progress rather than an empty board. -->
  <rect x="181" y="96" width="65" height="65" rx="14" fill="#A7F3D0" />
</svg>
